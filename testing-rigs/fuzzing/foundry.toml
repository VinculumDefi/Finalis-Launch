# Rig 3 (fuzzing). Foundry runs beside the Hardhat project and compiles the
# same production sources from base-contracts/contracts through the vf/
# remapping. Same compiler settings as hardhat.config.cjs (0.8.19, optimizer
# 200 runs, viaIR). Fixed fuzz seed so every run is reproducible.
[profile.default]
src = "test"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
allow_paths = ["../../base-contracts/contracts"]
remappings = [
  "vf/=../../base-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
gas_limit = 9223372036854775807
block_gas_limit = 9223372036854775807
memory_limit = 1073741824

[fuzz]
runs = 10000
seed = "0x5646525a5a3230323631303233"
max_test_rejects = 1000000
dictionary_weight = 40

[invariant]
runs = 256
depth = 64
fail_on_revert = false
