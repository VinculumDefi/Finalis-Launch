const logEl = document.getElementById("log");
function log(line) {
  logEl.textContent += line + "\n";
}

async function requireBase() {
  const eth = window.ethereum;
  if (!eth) throw new Error("MetaMask is not installed.");
  await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: BASE_CHAIN }] });
  const chainId = await eth.request({ method: "eth_chainId" });
  if (chainId !== BASE_CHAIN) throw new Error("Wallet is not on Base. Nothing was sent.");
  const accounts = await eth.request({ method: "eth_requestAccounts" });
  if (!accounts || !accounts[0]) throw new Error("MetaMask returned no account. Nothing was sent.");
  return { eth, from: ethers.getAddress(accounts[0]) };
}

async function deploy(eth, from, label, abi, bytecode, args) {
  const factory = new ethers.ContractFactory(abi, bytecode);
  const unsigned = await factory.getDeployTransaction(...args);
  log("Waiting for MetaMask: " + label);
  const hash = await eth.request({
    method: "eth_sendTransaction",
    params: [{ from, data: unsigned.data, value: "0x0" }],
  });
  log(label + " tx " + hash);
  let receipt = null;
  while (!receipt) {
    receipt = await eth.request({ method: "eth_getTransactionReceipt", params: [hash] });
    if (!receipt) await new Promise((r) => setTimeout(r, 2000));
  }
  if (receipt.status !== "0x1" || !receipt.contractAddress) {
    throw new Error(label + " was not deployed. Stopping.");
  }
  const address = ethers.getAddress(receipt.contractAddress);
  log(label + " " + address);
  return { address, receipt };
}

document.getElementById("go").onclick = async () => {
  try {
    const { eth, from } = await requireBase();
    log("signer " + from);
    log("Dev Fund " + DEV_FUND);
    const vclm = await deploy(eth, from, "VCLM", ARTS.token.abi, ARTS.token.bytecode, ["Vinculum", "VCLM", VCLM_HARD_CAP]);
    const block = await eth.request({ method: "eth_getBlockByNumber", params: [vclm.receipt.blockNumber, false] });
    const launchTimestamp = BigInt(block.timestamp);
    log("launchTimestamp " + launchTimestamp.toString());
    const chonx = await deploy(eth, from, "CHONX", ARTS.token.abi, ARTS.token.bytecode, ["Chonx", "CHONX", CHONX_HARD_CAP]);
    await deploy(eth, from, "CommitmentVaultLock", ARTS.lock.abi, ARTS.lock.bytecode, ["Base", DEV_FUND]);
    const verifier = await deploy(eth, from, "VinculumFinalisVerifier", ARTS.verifier.abi, ARTS.verifier.bytecode, [vclm.address, chonx.address]);
    const synth = await deploy(eth, from, "VinculumFinalisSynth", ARTS.synth.abi, ARTS.synth.bytecode, [verifier.address, vclm.address, chonx.address]);
    await deploy(eth, from, "VinculumFinalisStake", ARTS.stake.abi, ARTS.stake.bytecode, [vclm.address, chonx.address, synth.address, verifier.address, launchTimestamp]);
    log("Done.");
  } catch (err) {
    log(err.message || String(err));
  }
};
</script>
